[package]
name = "pga"
description = "Projective Geometric Algebra Cl(3,0,1): 16-component multivectors, blades and motors for 3D Euclidean geometry (Rust port of the pga V module)."
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]

[lints.clippy]
# The one default lint this crate does not follow, and the allowance it had as a workspace member of
# `simu` (whose Cargo.toml carries the full rationale): the numeric kernels index parallel arrays by
# a MODEL count — `n`, `components` — not by a slice's length, so the index is the maths the loop is
# written in and an iterator would take the bound from the slice instead.
needless_range_loop = "allow"
